<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flame Tuner</title>
<style>
  :root { color-scheme: dark; --bg:#17191b; --panel:#212427; --line:#34383c; --text:#e6e6e3; --dim:#9aa09d; --accent:#ffb454; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 250px 1fr 250px; }
  aside { background: var(--panel); padding: 10px; overflow-y: auto; min-height: 0; height: 100vh; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  main { display: flex; overflow: auto; height: 100vh; padding: 12px; }
  canvas { background: #3a423e; cursor: grab; touch-action: none; display: block; margin: auto; flex: none; }
  canvas.drag { cursor: grabbing; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 12px 0 6px; }
  h2:first-child { margin-top: 0; }
  .item { display: flex; justify-content: space-between; gap: 6px; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .item:hover { background: #2c3034; }
  .item.on { background: #4b3a20; color: #fff; }
  .item .id { color: var(--dim); font-variant-numeric: tabular-nums; }
  .item .dot { color: var(--accent); }
  select, button.b { background: #2c3034; color: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #231a08; border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { background: #2c3034; border-color: var(--line); color: var(--dim); cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
  .row label { display: flex; align-items: center; gap: 5px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td { padding: 2px 4px; }
  td:last-child { text-align: right; }
  kbd { background: #2c3034; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; }
  #help div { margin: 3px 0; color: var(--dim); }
  #status { min-height: 18px; color: var(--dim); }
  #status.dirty { color: var(--accent); }
  .flamebtn.on { background: var(--accent); color: #231a08; border-color: var(--accent); }
</style>
</head>
<body>
<aside id="left">
  <h2>Show</h2>
  <div class="row">
    <select id="filter" aria-label="Filter objects">
      <option value="all">All flames</option>
      <option value="torch">Torches</option>
      <option value="candle">Candles</option>
    </select>
  </div>
  <h2>Objects</h2>
  <div id="list"></div>
</aside>
<main><canvas id="view"></canvas></main>
<aside id="right">
  <h2 id="title">&nbsp;</h2>
  <div id="flames" class="row"></div>
  <table id="info"></table>
  <div class="row"><label><input type="checkbox" id="linked" checked> Move its animation frames too</label></div>
  <h2 id="sizetitle">Flame size</h2>
  <div class="row">
    <input type="range" id="size" min="0.15" max="2.5" step="0.01" value="1" aria-label="Flame size" style="flex:1;min-width:0">
    <span id="sizeval" style="font-variant-numeric:tabular-nums">100%</span>
  </div>
  <div class="row"><button class="b" id="smaller">Smaller</button><button class="b" id="bigger">Bigger</button></div>
  <h2>Arrow key step</h2>
  <div class="row">
    <select id="step" aria-label="Arrow key step">
      <option value="1">1 px</option><option value="0.5" selected>1/2 px</option><option value="0.25">1/4 px</option>
    </select>
  </div>
  <h2>Zoom</h2>
  <div class="row">
    <select id="zoom" aria-label="Zoom">
      <option>3</option><option selected>4</option><option>5</option><option>6</option>
    </select>
    <label><input type="checkbox" id="anim" checked> Animate</label>
  </div>
  <h2>Save</h2>
  <div class="row">
    <button class="b primary" id="save" disabled>Save</button>
    <button class="b" id="undo" disabled>Undo</button>
  </div>
  <div id="status" role="status"></div>
  <h2>Keys</h2>
  <div id="help">
    <div>Drag the flame (1/4 px steps), or use <kbd>Arrows</kbd></div>
    <div><kbd>Shift</kbd>+<kbd>Arrows</kbd> moves 5 px</div>
    <div><kbd>[</kbd> / <kbd>]</kbd> flame smaller / bigger</div>
    <div><kbd>Tab</kbd> next flame on this object</div>
    <div><kbd>N</kbd> / <kbd>P</kbd> next / previous object</div>
    <div><kbd>Ctrl</kbd>+<kbd>S</kbd> save, <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</div>
  </div>
</aside>
<script>
const VIEW_W = 130, VIEW_H = 170, ART_X = 65, ART_BOTTOM = 155;
const view = document.getElementById('view'), ctx = view.getContext('2d');
const $ = id => document.getElementById(id);
let data, strip, objects = [], shown = [], cur = 0, flame = 0, frame = 0, dirty = false;
const images = new Map(), undo = [];

function image(src) {
  if (!images.has(src)) {
    const i = new Image();
    i.onload = draw;
    i.src = 'data/' + src;
    images.set(src, i);
  }
  return images.get(src);
}

const hex = g => '0x' + g.toString(16).toUpperCase().padStart(4, '0');
const isTorch = o => o.flames.some(f => f.scene.toLowerCase().startsWith('torch'));

function anchorOf(f) {
  // The tile point sits 22 px above the art's bottom; the placement is as the client applies it.
  return [ART_X + (f.x - f.y) * 22, ART_BOTTOM - 22 + (f.x + f.y) * 22 - 16 - 4 * f.height];
}

function current() { return shown[cur]; }

function draw() {
  const z = +$('zoom').value, o = current();
  view.width = VIEW_W * z; view.height = VIEW_H * z;
  ctx.setTransform(z, 0, 0, z, 0, 0);
  ctx.imageSmoothingEnabled = true;
  // Opaque, or the additive flames would turn the canvas black around them.
  ctx.fillStyle = '#3a423e';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  if (!o) return;

  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1 / z;
  ctx.beginPath();
  ctx.moveTo(ART_X - 22, ART_BOTTOM - 22); ctx.lineTo(ART_X, ART_BOTTOM - 44);
  ctx.lineTo(ART_X + 22, ART_BOTTOM - 22); ctx.lineTo(ART_X, ART_BOTTOM); ctx.closePath(); ctx.stroke();

  const art = image(o.art);
  if (art.complete && art.naturalWidth) ctx.drawImage(art, ART_X - (o.w >> 1), ART_BOTTOM - o.h, o.w, o.h);

  ctx.globalCompositeOperation = 'lighter';
  o.flames.forEach(f => {
    const s = image(f.strip);
    if (!s.complete || !s.naturalWidth) return;
    const [px, py] = anchorOf(f), m = f.size || 1;
    ctx.drawImage(s, frame * strip.w, 0, strip.w, strip.h, px - strip.ax * m, py - strip.ay * m, strip.w * m, strip.h * m);
  });
  ctx.globalCompositeOperation = 'source-over';

  o.flames.forEach((f, i) => {
    const [px, py] = anchorOf(f), r = 3;
    ctx.strokeStyle = i === flame ? '#7fe3ff' : 'rgba(127,227,255,.35)';
    ctx.lineWidth = 1.5 / z;
    ctx.beginPath();
    ctx.moveTo(px - r, py); ctx.lineTo(px + r, py);
    ctx.moveTo(px, py - r); ctx.lineTo(px, py + r);
    ctx.stroke();
  });
}

function panel() {
  const o = current();
  if (!o) { $('title').textContent = 'Nothing to show'; return; }
  $('title').textContent = `${o.name || 'Unnamed'} ${hex(o.graphic)}`;
  $('flames').innerHTML = '';
  if (o.flames.length > 1) o.flames.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'b flamebtn' + (i === flame ? ' on' : '');
    b.textContent = 'Flame ' + (i + 1);
    b.onclick = () => { flame = i; panel(); draw(); };
    $('flames').append(b);
  });
  const f = o.flames[flame];
  $('info').innerHTML = `<tr><td>Script</td><td>${f.scene.replace('.ems', '')}</td></tr>
    <tr><td>Across</td><td>${(f.x - f.y).toFixed(3)}</td></tr>
    <tr><td>Height</td><td>${f.height.toFixed(2)}</td></tr>
    <tr><td>Scale</td><td>${f.scale}</td></tr>`;
  $('sizetitle').textContent = 'Flame size: all ' + (kind(f) === 'torch' ? 'torches' : 'candles');
  $('size').value = f.size || 1;
  $('sizeval').textContent = Math.round((f.size || 1) * 100) + '%';
}

function list() {
  const box = $('list'); box.innerHTML = '';
  shown.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'item' + (i === cur ? ' on' : '');
    const name = document.createElement('span');
    name.textContent = (o.touched ? '• ' : '') + (o.name || 'Unnamed');
    if (o.touched) name.className = 'dot';
    const id = document.createElement('span');
    id.className = 'id'; id.textContent = hex(o.graphic);
    b.append(name, id);
    b.onclick = () => select(i);
    box.append(b);
  });
  const on = box.querySelector('.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function select(i) {
  if (!shown.length) return;
  cur = (i + shown.length) % shown.length; flame = 0;
  list(); panel(); draw();
}

function filter() {
  const v = $('filter').value;
  shown = objects.filter(o => v === 'all' || (v === 'torch') === isTorch(o));
  select(0);
}

function setDirty(v, msg) {
  dirty = v;
  $('save').disabled = !v;
  $('undo').disabled = !undo.length;
  $('status').textContent = msg || (v ? 'Unsaved changes' : '');
  $('status').className = v ? 'dirty' : '';
}

function targets(o) {
  if (!$('linked').checked) return [o];
  return objects.filter(a => a.group === o.group && a.flames.length === o.flames.length);
}

function snapshot(list) {
  return list.map(o => ({ o, i: flame, x: o.flames[flame].x, y: o.flames[flame].y, height: o.flames[flame].height, size: o.flames[flame].size, touched: o.touched }));
}

function move(dx, dy, group) {
  const o = current();
  if (!o || (!dx && !dy)) return;
  const list = targets(o);
  if (group !== false) undo.push(snapshot(list));
  if (undo.length > 300) undo.shift();
  list.forEach(a => {
    const f = a.flames[flame];
    // Across the screen only: moving x and y oppositely leaves the height alone.
    f.x = +(f.x + dx / 44).toFixed(4);
    f.y = +(f.y - dx / 44).toFixed(4);
    f.height = +(f.height - dy / 4).toFixed(3);
    a.touched = true;
  });
  setDirty(true); panel(); draw(); list_refresh();
}

const kind = f => f.scene.toLowerCase().startsWith('torch') ? 'torch' : 'candle';

// Every flame of this type, on every object: a size belongs to the type.
function sameType(type) {
  const out = [];
  objects.forEach(o => o.flames.forEach((f, i) => { if (kind(f) === type) out.push({ o, f, i }); }));
  return out;
}

function snapshotType(type) {
  return sameType(type).map(({ o, f, i }) => ({ o, i, x: f.x, y: f.y, height: f.height, size: f.size, touched: o.touched }));
}

function setSize(value, record) {
  const o = current();
  if (!o) return;
  const s = Math.min(2.5, Math.max(0.15, value)), type = kind(o.flames[flame]);
  if (record !== false) { undo.push(snapshotType(type)); if (undo.length > 300) undo.shift(); }
  sameType(type).forEach(({ o: a, f }) => {
    const old = f.size || 1;
    // Keep the base of the fire where it is while it grows or shrinks.
    f.x = +(f.x + (f.baseX || 0) * f.scale * (old - s)).toFixed(4);
    f.height = +(f.height + 8 * (f.baseZ || 0) * f.scale * (old - s)).toFixed(3);
    f.size = +s.toFixed(3);
    a.touched = true;
  });
  setDirty(true); panel(); draw(); list_refresh();
}

function list_refresh() {
  document.querySelectorAll('#list .item').forEach((b, i) => {
    const s = b.firstChild, o = shown[i];
    s.textContent = (o.touched ? '• ' : '') + (o.name || 'Unnamed');
    s.className = o.touched ? 'dot' : '';
  });
}

function undoLast() {
  const step = undo.pop();
  if (!step) return;
  step.forEach(s => { const f = s.o.flames[s.i]; f.x = s.x; f.y = s.y; f.height = s.height; f.size = s.size; s.o.touched = s.touched; });
  setDirty(true, 'Undone'); panel(); draw(); list_refresh();
}

async function save() {
  $('status').textContent = 'Saving...';
  const body = { strip, objects: objects.map(({ touched, ...o }) => o) };
  try {
    const r = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('server said ' + r.status);
    objects.forEach(o => o.touched = false);
    undo.length = 0;
    setDirty(false, 'Saved');
    list_refresh();
  } catch (e) {
    $('status').textContent = 'Save failed: ' + e.message;
    $('status').className = 'dirty';
  }
}

let drag = null;
function point(e) {
  const r = view.getBoundingClientRect(), z = +$('zoom').value;
  return [(e.clientX - r.left) / z, (e.clientY - r.top) / z];
}
view.addEventListener('pointerdown', e => {
  const o = current(); if (!o) return;
  const [mx, my] = point(e);
  let best = flame, bestD = Infinity;
  o.flames.forEach((f, i) => { const [px, py] = anchorOf(f); const d = (px - mx) ** 2 + (py - my) ** 2; if (d < bestD) { bestD = d; best = i; } });
  if (best !== flame) { flame = best; panel(); }
  undo.push(snapshot(targets(o)));
  drag = { x: mx, y: my, moved: false };
  view.setPointerCapture(e.pointerId); view.classList.add('drag');
  $('undo').disabled = false;
  draw();
});
view.addEventListener('pointermove', e => {
  if (!drag) return;
  const [mx, my] = point(e), dx = Math.trunc((mx - drag.x) * 4) / 4, dy = Math.trunc((my - drag.y) * 4) / 4;
  if (!dx && !dy) return;
  drag.x += dx; drag.y += dy; drag.moved = true;
  move(dx, dy, false);
});
function endDrag() { if (drag && !drag.moved) { undo.pop(); $('undo').disabled = !undo.length; } drag = null; view.classList.remove('drag'); }
view.addEventListener('pointerup', endDrag);
view.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.type === 'range') return;
  const step = e.shiftKey ? 5 : +$('step').value, k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 's') { e.preventDefault(); if (dirty) save(); return; }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); undoLast(); return; }
  if (k === 'ArrowLeft') move(-step, 0);
  else if (k === 'ArrowRight') move(step, 0);
  else if (k === 'ArrowUp') move(0, -step);
  else if (k === 'ArrowDown') move(0, step);
  else if (k === '[') { const o = current(); if (o) setSize((o.flames[flame].size || 1) - (e.shiftKey ? 0.2 : 0.05)); }
  else if (k === ']') { const o = current(); if (o) setSize((o.flames[flame].size || 1) + (e.shiftKey ? 0.2 : 0.05)); }
  else if (k === 'Tab') { const o = current(); if (o) flame = (flame + 1) % o.flames.length; panel(); draw(); }
  else if (k.toLowerCase() === 'n') select(cur + 1);
  else if (k.toLowerCase() === 'p') select(cur - 1);
  else return;
  e.preventDefault();
});

$('filter').onchange = filter;
$('size').addEventListener('pointerdown', () => { const o = current(); if (o) { undo.push(snapshotType(kind(o.flames[flame]))); $('undo').disabled = false; } });
$('size').addEventListener('input', e => setSize(+e.target.value, false));
$('smaller').onclick = () => { const o = current(); if (o) setSize((o.flames[flame].size || 1) - 0.05); };
$('bigger').onclick = () => { const o = current(); if (o) setSize((o.flames[flame].size || 1) + 0.05); };
$('zoom').onchange = draw;
$('save').onclick = save;
$('undo').onclick = undoLast;
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

setInterval(() => { if ($('anim').checked && strip) { frame = (frame + 1) % strip.frames; draw(); } }, 1000 / 15);

fetch('data/flames.json', { cache: 'no-store' }).then(r => r.json()).then(j => {
  data = j; strip = j.strip; objects = j.objects;
  filter();
}).catch(e => { $('title').textContent = 'Could not load: ' + e.message; });
</script>
</body>
</html>
